<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dkey(new Date());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const fmt = k => parseKey(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

/* ---------- state ---------- */
const CATS = { sleep: "Sleep", body: "Body", work: "Work", mind: "Mind", social: "People", recovery: "Recovery" };
function demoState() {
  const t = today();
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const habits = [
    { id: "h1", name: "Zone-2 walk or run, 30 minutes", kind: "build" },
    { id: "h2", name: "90-minute deep work block", kind: "build" },
    { id: "h3", name: "Read 20 pages", kind: "build" },
    { id: "h4", name: "No screens in the last 45 minutes before bed", kind: "avoid" },
    { id: "h5", name: "No doomscrolling before noon", kind: "avoid" },
    { id: "h6", name: "Alcohol-free day", kind: "avoid" }
  ];
  const routine = [
    { id: "r1", time: "07:00", label: "Wake, water, 10 minutes of daylight", cat: "body" },
    { id: "r2", time: "08:30", label: "Plan the day: three outcomes only", cat: "mind" },
    { id: "r3", time: "09:00", label: "Deep work block", cat: "work" },
    { id: "r4", time: "13:00", label: "Lunch away from the screen", cat: "recovery" },
    { id: "r5", time: "17:30", label: "Zone-2 exercise", cat: "body" },
    { id: "r6", time: "20:00", label: "One message to a person who matters", cat: "social" },
    { id: "r7", time: "21:30", label: "Journal: what I did, what I avoided", cat: "mind" },
    { id: "r8", time: "23:00", label: "Screens off, lights out by 23:30", cat: "sleep" }
  ];
  const hlog = {}, rlog = {}, checkin = {};
  const hp = [0.72, 0.58, 0.45, 0.35, 0.5, 0.82];
  for (let i = 14; i >= 1; i--) {
    const k = addDays(t, -i);
    hlog[k] = {}; habits.forEach((h, j) => { if (rnd() < hp[j]) hlog[k][h.id] = true; });
    rlog[k] = {}; routine.forEach(r => { if (rnd() < 0.62) rlog[k][r.id] = true; });
    checkin[k] = { sleep: Math.round((5.6 + rnd() * 2.2) * 10) / 10, energy: 2 + Math.floor(rnd() * 3), mood: 2 + Math.floor(rnd() * 3) };
  }
  const j = (n, text) => ({ id: uid(), date: addDays(t, -n), text, ai: null });
  return {
    v: 1, demo: true, updated: 0,
    profile: { type: "INTJ", wake: "07:00", sleep: "23:30", goals: "", strengths: "", weaknesses: "" },
    habits, hlog, routine, rlog, checkin,
    journal: [
      j(1, "Finished the architecture draft. Skipped the walk because the draft felt more important. Stayed up too late and my head was foggy this morning."),
      j(3, "Declined a dinner invite to protect focus time. Felt efficient, then a bit flat by the evening."),
      j(6, "Good day. Walked first, then deep work. Wrote in the journal before bed. Slept well.")
    ],
    people: [
      { id: "p1", name: "College friend", rel: "Friend", cadence: 21, last: addDays(t, -40), notes: "Example entry" },
      { id: "p2", name: "Mentor", rel: "Mentor", cadence: 45, last: addDays(t, -20), notes: "Example entry" },
      { id: "p3", name: "Sibling", rel: "Family", cadence: 7, last: addDays(t, -3), notes: "Example entry" }
    ],
    contacts: [
      { id: uid(), date: addDays(t, -3), who: "p3", kind: "call", fresh: false },
      { id: uid(), date: addDays(t, -9), who: "p2", kind: "message", fresh: false }
    ],
    social: { weekly: 2, newMonthly: 1 },
    reminders: [
      { id: "m1", time: "21:30", text: "Write tonight's journal entry" },
      { id: "m2", time: "23:00", text: "Screens off. Lights out by 23:30" }
    ],
    rdone: {}
  };
}
let S = null;
let D = {};            // unsaved form drafts, kept across re-renders
let view = "today";
let ai = {};           // transient AI results and busy flags
let coachTurns = [];
const VIEWS = [["today", "Today"], ["habits", "Habits"], ["journal", "Journal"], ["routine", "Routine"], ["career", "Career"], ["people", "People"], ["brain", "Brain"], ["type", "Type"], ["coach", "Coach"], ["me", "Me"]];

/* ---------- storage: private db document when signed in, localStorage as a mirror ---------- */
const LS = "longview.v1";
let docRef = null, saving = false, pending = false, timer = null;
function lsGet() { try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSet() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }
function setStatus(t) { const el = $("#status"); if (el) el.textContent = t; }
function save() { S.updated = Date.now(); lsSet(); clearTimeout(timer); timer = setTimeout(flush, 700); }
async function flush() {
  if (!docRef) { setStatus("Saved in this browser"); return; }
  if (saving) { pending = true; return; }
  saving = true;
  try { await docRef.set({ state: JSON.stringify(S), updated: S.updated }); setStatus("Saved to your account"); }
  catch (e) { setStatus(e && e.code === "quota_exceeded" ? "Storage is full. Export your data from Me." : "Saved in this browser only"); }
  saving = false;
  if (pending) { pending = false; flush(); }
}
async function connectStore() {
  try {
    const c = window.claude; if (!c) { setStatus("Saved in this browser"); return; }
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) { setStatus("Saved in this browser"); return; }
    const id = await user.id();
    if (!id) { setStatus("Saved in this browser"); return; }
    docRef = db.doc("data/users/" + id + "/main");
    const snap = await docRef.get();
    if (snap.exists) {
      const remote = JSON.parse(snap.data().state);
      if ((remote.updated || 0) >= (S.updated || 0)) { S = remote; lsSet(); render(); }
      else flush();
    } else flush();
    setStatus("Saved to your account");
  } catch (e) { setStatus("Saved in this browser"); }
}

/* ---------- scoring ---------- */
const W = { routine: 25, habits: 25, sleep: 25, mind: 10, connect: 15 };
const PNAME = { routine: "Routine", habits: "Habits", sleep: "Sleep", mind: "Mind", connect: "Connection" };
const sleepScore = h => h >= 7 && h <= 9 ? 100 : h < 7 ? Math.max(0, 100 - (7 - h) * 28) : Math.max(0, 100 - (h - 9) * 28);
function firstTracked() {
  const ks = [...Object.keys(S.hlog), ...Object.keys(S.rlog), ...Object.keys(S.checkin), ...S.journal.map(j => j.date)];
  const nonEmpty = ks.filter(k => (S.hlog[k] && Object.keys(S.hlog[k]).length) || (S.rlog[k] && Object.keys(S.rlog[k]).length) || S.checkin[k] || S.journal.some(j => j.date === k));
  return nonEmpty.length ? nonEmpty.sort()[0] : null;
}
function dayP(k) {
  const p = {};
  const rs = S.routine, hs = S.habits;
  p.routine = rs.length ? rs.filter(r => (S.rlog[k] || {})[r.id]).length / rs.length * 100 : null;
  p.habits = hs.length ? hs.filter(h => (S.hlog[k] || {})[h.id]).length / hs.length * 100 : null;
  const c = S.checkin[k];
  p.sleep = c && c.sleep !== "" && c.sleep != null ? sleepScore(+c.sleep) : null;
  const j = S.journal.some(x => x.date === k) ? 1 : 0;
  p.mind = c && c.mood ? (j * 0.5 + c.mood / 5 * 0.5) * 100 : j * 100;
  let n = 0; for (let i = 0; i < 7; i++) { const dd = addDays(k, -i); n += S.contacts.filter(x => x.date === dd).length; }
  p.connect = Math.min(1, n / (S.social.weekly || 2)) * 100;
  return p;
}
function dayScore(k) {
  const p = dayP(k); let s = 0, w = 0;
  for (const key in W) if (p[key] != null) { s += p[key] * W[key]; w += W[key]; }
  return w ? s / w : null;
}
function windowDays(n = 14) {
  const f = firstTracked(); if (!f) return [];
  const out = [];
  for (let i = n; i >= 1; i--) { const k = addDays(today(), -i); if (k >= f) out.push(k); }
  return out;
}
function pil() {
  const days = windowDays(); if (!days.length) return null;
  const agg = {}; for (const key in W) { const v = days.map(k => dayP(k)[key]).filter(x => x != null); agg[key] = v.length ? mean(v) : null; }
  let s = 0, w = 0; for (const key in W) if (agg[key] != null) { s += agg[key] * W[key]; w += W[key]; }

  remDone(t) { const k = today(); (S.rdone[k] = S.rdone[k] || {})[t.dataset.id] = true; save(); renderDue(); },
  remSnooze(t) { const d = new Date(Date.now() + 600000); snooze[t.dataset.id] = pad(d.getHours()) + ":" + pad(d.getMinutes()); renderDue(); },
  clearDemo() { const p = S.profile; S = { v: 1, demo: false, updated: 0, profile: p, habits: [], hlog: {}, routine: [], rlog: {}, checkin: {}, journal: [], people: [], contacts: [], social: { weekly: 2, newMonthly: 1 }, reminders: [], rdone: {} }; save(); location.hash = "#routine"; route(); },
  saveJournal() { const v = (D.journal || "").trim(); if (!v) return; S.journal.unshift({ id: uid(), date: today(), text: v, ai: null }); D.journal = ""; save(); render(); },
  logContact(t) { const p = S.people.find(x => x.id === t.dataset.id); if (!p) return; p.last = today(); S.contacts.push({ id: uid(), date: today(), who: p.id, kind: "contact", fresh: false }); save(); render(); },
  addSuggested(t) { const h = ai.habits[+t.dataset.i]; if (!h) return; S.habits.push({ id: uid(), name: h.name, kind: h.kind === "avoid" ? "avoid" : "build" }); ai.habits.splice(+t.dataset.i, 1); save(); render(); },
  applyRoutine(t) { const items = ai.routine.map(r => ({ id: uid(), time: r.time, label: r.label, cat: CATS[r.cat] ? r.cat : "mind" })); S.routine = t.dataset.mode === "replace" ? items : S.routine.concat(items); ai.routine = null; save(); render(); },
  copyDraft(t) { const txt = ai["d" + t.dataset.id] || ""; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { t.textContent = "Copied"; }, () => { t.textContent = "Select the text and copy"; }); },
  async exportData() { try { const dl = await window.claude.use("downloads"); if (!dl) throw 0; await dl.save({ filename: "longview-data.json", data: JSON.stringify(S, null, 2) }); } catch (e) { if (!e || e.code !== "declined") setStatus("Export is not available in this view"); } },
  resetAll(t) { if (!ai.confirmReset) { ai.confirmReset = true; render(); return; } ai.confirmReset = false; S = emptyAll(); D = {}; save(); location.hash = "#today"; route(); },
  stop() { if (ctl) ctl.abort(); },
  coachChip(t) { sendCoach(t.dataset.q); },
  async readOutlook() {
    ctl = new AbortController(); ai.outlookBusy = true; ai.outlook = "Thinking..."; render();
    try { const r = await askText("Look at this person's last 14 days of data. In under 220 words: say where this trajectory leads in 90 days if nothing changes, name the two behaviours that matter most, and give three concrete actions for this week. Their data: " + ctx(), { signal: ctl.signal, onText: u => { ai.outlook = u.text; const o = $("#outlookOut"); if (o) o.textContent = u.text; } }); ai.outlook = r.text; }
    catch (e) { ai.outlook = (e.text || "") + (e.code === "cancelled" ? "" : "\n\n" + errText(e)); }
    ai.outlookBusy = false; render();
  },
  async genHabits() {
    ai.habitsBusy = true; ai.habitsErr = ""; render();
    try { ai.habits = (await askJson('Reply with only a JSON array of 5 objects like {"name": string under 60 chars, "kind": "build" or "avoid", "why": one sentence tied to this person\'s data}. Suggest habits that fix their weaknesses and protect brain health. Do not repeat habits they already track. Their data: ' + ctx(), { modelTier: "default" })).filter(h => h && h.name).slice(0, 6); }
    catch (e) { ai.habitsErr = errText(e); }
    ai.habitsBusy = false; render();
  },
  async genRoutine() {
    const wake = D.rwake || S.profile.wake, bed = D.rbed || S.profile.sleep, notes = D.rnotes || "";
    ai.routineBusy = true; ai.routineErr = ""; render();
    try {
      const r = await askJson('Reply with only a JSON array of 9 to 12 objects like {"time": "HH:MM" in 24h, "label": string under 60 chars, "cat": one of "sleep","body","work","mind","social","recovery"}, in time order, for one ordinary day. Wake at ' + wake + ", lights out by " + bed + ". Include a morning daylight block, an exercise block, deep work, a screen-free wind-down, a short daily social touch (one message or call to a person who matters), and an evening journal. Keep it realistic. Constraints from the person: " + (notes || "none") + ". Their data: " + ctx(), { modelTier: "default" });
      ai.routine = r.filter(x => x && /^\d{2}:\d{2}$/.test(x.time) && x.label).slice(0, 14);
      if (!ai.routine.length) throw { code: "invalid_json" };
    } catch (e) { ai.routineErr = errText(e); }
    ai.routineBusy = false; render();
  },
  async reflect(t) {
    const j = S.journal.find(x => x.id === t.dataset.id); if (!j) return;
    ai["j" + j.id] = true; ai["je" + j.id] = ""; render();
    try { j.ai = await askJson('Reply with only a JSON object {"pattern": one or two sentences, "do": array of 3 short actions for tomorrow, "avoid": array of 2 short things to stop, "outcome": two sentences on where this leads in 90 days if the pattern repeats}. Be specific and candid, no flattery, no medical claims beyond mainstream evidence. Journal entry from ' + j.date + ': """' + j.text.slice(0, 2000) + '""" Their data: ' + ctx(), { modelTier: "default" }); if (!j.ai || !j.ai.pattern) { j.ai = null; throw { code: "invalid_json" }; } save(); }
    catch (e) { ai["je" + j.id] = errText(e); }
    ai["j" + j.id] = false; render();
  },
  async draft(t) {
    const p = S.people.find(x => x.id === t.dataset.id); if (!p) return;
    ai["db" + p.id] = true; render();
    try { const r = await askText("Write a short, low-pressure message (under 45 words, plain text, no emojis) from this person to someone they have not spoken to in a while. It should sound natural and specific, not needy, and end with an easy next step. Relationship: " + p.rel + ". Days since last contact: " + (p.last ? diffDays(today(), p.last) : "unknown") + ". Notes: " + (p.notes || "none") + ". Reply with the message only.", { cache: false }); ai["d" + p.id] = r.text; }
    catch (e) { ai["d" + p.id] = errText(e); }
    ai["db" + p.id] = false; render();
  }
};
let ctl = null;
function emptyAll() { return { v: 1, demo: false, updated: 0, profile: { type: "INTJ", wake: "07:00", sleep: "23:30", goals: "", strengths: "", weaknesses: "" }, habits: [], hlog: {}, routine: [], rlog: {}, checkin: {}, journal: [], people: [], contacts: [], social: { weekly: 2, newMonthly: 1 }, reminders: [], rdone: {} }; }
async function sendCoach(q) {
  q = (q || "").trim(); if (!q || ai.coachBusy) return;
  coachTurns.push({ role: "user", content: q }); coachTurns.push({ role: "assistant", content: "Thinking..." });
  ai.coachBusy = true; ctl = new AbortController(); render();
  const idx = coachTurns.length - 1, input = [{ role: "user", content: COACH_RULES + ctx() }].concat(coachTurns.slice(0, idx).filter(t => t.content !== "Thinking...").slice(-12));
  try { const r = await askText(input, { cache: false, signal: ctl.signal, onText: u => { coachTurns[idx].content = u.text; const b = $("#chat")?.lastElementChild; if (b) b.textContent = u.text; } }); coachTurns[idx].content = r.text; }
  catch (e) { coachTurns[idx].content = (e.text ? e.text + "\n\n" : "") + (e.code === "cancelled" ? "Stopped." : errText(e)); }
  ai.coachBusy = false; render();
}

/* ---------- forms and inputs ---------- */
const forms = {
  addJob(f) { const st = $("#jstage").value; S.career.jobs.push({ id: uid(), company: $("#jco").value.trim(), role: $("#jrole").value.trim(), plan: $("#jplan").value, stage: st, applied: st === "saved" ? "" : today() }); save(); render(); },
  addPort(f) { S.career.portfolio.push({ id: uid(), name: $("#portname").value.trim(), done: {} }); save(); render(); },
  privStart(f) { S.career.priv = { on: true, label: $("#privname").value.trim(), start: today(), best: 0 }; save(); render(); },
  addHabit(f) { const n = $("#hname").value.trim(); if (!n) return; S.habits.push({ id: uid(), name: n, kind: $("#hkind").value }); save(); render(); },
  addRoutine(f) { S.routine.push({ id: uid(), time: $("#rtime").value, label: $("#rlabel").value.trim(), cat: $("#rcat").value }); save(); render(); },
  addReminder(f) { S.reminders.push({ id: uid(), time: $("#mtime").value, text: $("#mtext").value.trim() }); save(); render(); },
  addPerson(f) { const l = $("#plast").value.trim(); S.people.push({ id: uid(), name: $("#pname").value.trim(), rel: $("#prel").value.trim() || "Contact", cadence: Math.max(1, +$("#pcad").value || 30), last: /^\d{4}-\d{2}-\d{2}$/.test(l) ? l : "", notes: "" }); save(); render(); },
  newPerson(f) { const id = uid(); S.people.push({ id, name: $("#nname").value.trim(), rel: "New", cadence: 30, last: today(), notes: $("#nnote").value.trim() }); S.contacts.push({ id: uid(), date: today(), who: id, kind: "meet", fresh: true }); save(); render(); },
  coach(f) { const i = $("#cin"); const v = i.value; i.value = ""; sendCoach(v); }
};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && acts[t.dataset.act]) acts[t.dataset.act](t, e); });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (f && forms[f.dataset.form]) { e.preventDefault(); forms[f.dataset.form](f); } });
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.draft) D[t.dataset.draft] = t.value; });
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.jplan) { const j = S.career.jobs.find(x => x.id === t.dataset.jplan); if (j) { j.plan = t.value; save(); render(); } }
  else if (t.dataset.job) { const j = S.career.jobs.find(x => x.id === t.dataset.job); if (j) { j.stage = t.value; if (t.value !== "saved" && !j.applied) j.applied = today(); save(); render(); } }
  else if (t.dataset.ci) { ci()[t.dataset.ci] = t.value === "" ? "" : clamp(+t.value, 0, 14); save(); render(); }
  else if (t.dataset.set) { const [a, b] = t.dataset.set.split("."); S[a][b] = t.type === "number" ? Math.max(0, +t.value || 0) : t.value; save(); if (a === "social") render(); }
  else if (t.dataset.draft) D[t.dataset.draft] = t.value;
});

/* ---------- boot ---------- */
S = lsGet();
if (!S || !S.habits) S = demoState();
S.rdone = S.rdone || {};
route();
connectStore();
</script>
