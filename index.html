const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, "0");
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

const REL = {"en": {"h": "People: compatibility, maturity and when to leave", "intro": "This is a guide, not a law. MBTI compatibility is a rough pattern from how the functions fit together, and the research behind it is weak. Treat it as a way to anticipate friction, not to pick or reject people.", "compH": "Who tends to fit an INTJ", "comp": [["Often the easiest fit", "ENFP · ENTP", "Their Ne feeds your Ni with new options, and they enjoy deep ideas. ENFP adds warmth and gets you out of your head, ENTP matches your logic and keeps debates fun. Risk: they can be scattered, so you may feel you do all the follow-through."], ["Strong, with some friction", "INFJ · INTJ · INTP · ENTJ", "Shared Ni or shared thinking style means quick understanding. INFJ is the closest in depth. Two INTJs respect each other but may go silent and compete on being right. ENTJ pushes you to act but can fight you for control. INTP matches your mind but may not commit or act."], ["Need extra effort", "ISTJ · ISFJ · ESTJ · ESFJ · ESTP · ESFP · ISTP · ISFP · INFP · ENFJ", "These types run on different priorities (routine, harmony, the present moment, personal values). They can be loyal and stabilising for you, but you will need to translate in both directions. The effort is real, and it is also where you grow the most."]], "matH": "Maturity matters more than compatibility", "matIntro": "Two mature people of any types usually do better than two immature people who are a perfect match on paper. A compatible but immature person can still hurt you, and a very different but mature person can be the best thing in your life. Look at these before you look at the type:", "mat": [["They own their mistakes and apologise without being pushed.", ""], ["They can disagree with you without contempt, silence or threats.", ""], ["They do what they say, and their mood does not run the room.", ""], ["They respect your need for space instead of treating it as rejection.", ""], ["They are working on themselves, even slowly, and you can see change over months.", ""]], "endH": "Do not be afraid to end it", "endIntro": "As an INTJ you may fall into one of two traps. One is staying too long because of loyalty and sunk cost: I already invested years in this. The other is cutting someone off in one cold move after silently collecting evidence. Both are Ni running without Te and Fe. A healthier way is below.", "end": [["Leave when the pattern stays after honest talks", "If you explained clearly what hurts, gave real time, and the same behaviour keeps returning, that is information. Repeated disrespect, lying, control, contempt or constant drama is a reason to end it, however compatible the type."], ["Staying small is not loyalty", "Years together do not turn a harmful relationship into a good one. A good future version of you will not carry people who drain him with no change in sight."], ["Do not leave over a single bad day", "A first disagreement or one uncomfortable talk is not evidence. Ni jumps to the final conclusion early, so ask whether this is a pattern or one moment before you decide."], ["End it clearly and kindly", "Say it directly once, give a short honest reason, and avoid ghosting or a cold exit. That keeps your integrity and lets you move on without replaying it."], ["Check your own part", "Before ending, ask what you did: did you withdraw, stay unclear, or expect them to guess? If yes, one honest conversation may fix it. If you already had it, you can leave with a clear mind."]], "typesH": "Dealing with each type", "typesIntro": "The challenge is what you will likely hit. The tip is how to be liked honestly: people like you when they feel respected and safe, so this is about showing real regard in a form they recognise, not pretending to be someone else.", "ch": "Challenge", "wn": "How to win them", "types": [["INTJ", "Two strong wills, both sure they are right, and both prone to silence.", "Respect their competence, say things directly, and give each other space without keeping score."], ["INTP", "They keep analysing and delay deciding, which frustrates your wish to finish.", "Debate ideas with them, give time on decisions, and do not push them to commit instantly."], ["ENTJ", "A power struggle over who leads, and blunt criticism.", "Come with evidence and a clear plan, disagree directly, and let them lead where it makes sense."], ["ENTP", "They argue for fun, and it can feel like an attack on your plan.", "Join the debate, show curiosity, and do not take it personally. They like people who push back well."], ["INFJ", "They feel your withdrawal deeply and may read you better than you like.", "Be honest about your inner life, show steady care, and do not disappear without explanation."], ["INFP", "Hurt by bluntness, values-driven, and slow to say what bothers them.", "Soften how you phrase things, ask what matters to them, and respect their values even when you disagree."], ["ENFJ", "They want closeness and emotional presence, and may feel pushy to you.", "Show appreciation in small regular ways and tell them what you feel before they have to ask."], ["ENFP", "Enthusiastic and scattered, and wants emotional sharing you may find tiring.", "Listen to their ideas, share your own vision, and give them warmth in short, genuine moments."], ["ISTJ", "They like routine and tradition and resist your abstract changes.", "Be reliable, keep your promises, and show practical results before you ask for change."], ["ISFJ", "They need appreciation, avoid conflict and get hurt without saying it.", "Say thank you, remember details about their life, and ask directly if something is wrong."], ["ESTJ", "Rule-focused, blunt and sure of their way of doing things.", "Be on time, show results, respect structure, and argue with facts, not with feelings."], ["ESFJ", "People and harmony come first, and you may look cold to them.", "Show up to the things they care about and ask about the people in their life."], ["ISTP", "Private like you, so closeness can stay shallow for a long time.", "Do things together instead of talking, and never force them to open up."], ["ISFP", "Private feelings and avoids confrontation, then walks away if pressured.", "Give freedom, appreciate their taste and craft, and bring up problems gently."], ["ESTP", "Fast, impulsive and present-focused, which clashes with your long-term view.", "Be concrete, direct and willing to act, and keep a sense of fun."], ["ESFP", "They want spontaneity and attention, and you may seem too serious.", "Be present and playful, praise them genuinely, and let some plans stay loose."]]}, "ar": {"h": "الناس: التوافق والنضج ومتى تنهي العلاقة", "intro": "هذا دليل وليس قانونًا. توافق MBTI نمط تقريبي من طريقة تفاعل الوظائف، والأبحاث خلفه ضعيفة. استخدمه لتتوقع الاحتكاك، لا لتختار الناس أو ترفضهم.", "compH": "من يناسب الـ INTJ غالبًا", "comp": [["الأسهل غالبًا", "ENFP · ENTP", "وظيفة Ne عندهم تغذي Ni عندك بخيارات جديدة، ويستمتعون بالأفكار العميقة. ENFP يضيف الدفء ويخرجك من رأسك، وENTP يطابق منطقك ويجعل النقاش ممتعًا. الخطر: قد يكونون مشتتين فتشعر أنك من يتولى المتابعة دائمًا."], ["قوي مع بعض الاحتكاك", "INFJ · INTJ · INTP · ENTJ", "اشتراك Ni أو أسلوب التفكير يعطي فهمًا سريعًا. INFJ الأقرب في العمق. INTJ مع INTJ يحترمان بعضهما لكن قد يصمتان ويتنافسان على من هو على حق. ENTJ يدفعك للفعل لكنه قد ينازعك السيطرة. INTP يماثل عقلك لكنه قد لا يلتزم أو يتصرف."], ["يحتاجون جهدًا إضافيًا", "ISTJ · ISFJ · ESTJ · ESFJ · ESTP · ESFP · ISTP · ISFP · INFP · ENFJ", "هؤلاء تحركهم أولويات مختلفة (الروتين، الانسجام، اللحظة الحالية، القيم الشخصية). قد يكونون مخلصين ومستقرين لك، لكنك ستحتاج إلى الترجمة في الاتجاهين. الجهد حقيقي، وهنا تنمو أكثر."]], "matH": "النضج أهم من التوافق", "matIntro": "شخصان ناضجان من أي نوعين غالبًا أفضل من شخصين غير ناضجين متوافقين على الورق. الشخص المتوافق غير الناضج قد يؤذيك، والمختلف الناضج قد يكون أفضل ما في حياتك. انظر إلى هذه قبل أن تنظر إلى النوع:", "mat": [["يعترف بأخطائه ويعتذر دون أن تدفعه.", ""], ["يختلف معك دون ازدراء أو صمت عقابي أو تهديد.", ""], ["يفعل ما يقول، ومزاجه لا يتحكم في الجو العام.", ""], ["يحترم حاجتك إلى المساحة بدل أن يعتبرها رفضًا.", ""], ["يعمل على نفسه ولو ببطء، وترى تغيرًا عبر أشهر.", ""]], "endH": "لا تخف أن تنهي العلاقة", "endIntro": "كـ INTJ قد تقع في أحد فخين. الأول البقاء طويلًا بدافع الوفاء والاستثمار السابق: لقد استثمرت سنوات في هذا. والثاني قطع العلاقة بحركة باردة واحدة بعد جمع الأدلة بصمت. كلاهما Ni يعمل بلا Te وFe. الطريقة الأصح فيما يلي.", "end": [["غادر حين يستمر النمط بعد حديث صريح", "إذا شرحت بوضوح ما يؤلمك وأعطيت وقتًا حقيقيًا ويعود السلوك نفسه، فهذه معلومة. الازدراء المتكرر أو الكذب أو التحكم أو الدراما الدائمة سبب كافٍ للإنهاء، مهما كان النوع متوافقًا."], ["البقاء في مكان ضيق ليس وفاء", "سنوات العلاقة لا تحول علاقة مؤذية إلى جيدة. النسخة الأفضل منك لن تحمل أشخاصًا يستنزفونه دون أمل في التغيير."], ["لا تغادر بسبب يوم سيئ واحد", "أول خلاف أو حديث غير مريح ليس دليلًا. Ni يقفز إلى الخلاصة مبكرًا، فاسأل: هل هذا نمط أم لحظة؟ قبل أن تقرر."], ["أنهِها بوضوح ولطف", "قلها مباشرة مرة واحدة مع سبب قصير وصادق، وتجنب الاختفاء أو الخروج البارد. هذا يحفظ نزاهتك ويسمح لك بالمضي دون إعادة التفكير."], ["راجع دورك أنت", "قبل الإنهاء اسأل: هل انسحبت أو لم أكن واضحًا أو توقعت أن يخمّنوا؟ إن كان نعم، فقد تكفي محادثة صادقة. وإن أجريتها فعلًا، تغادر بذهن صافٍ."]], "typesH": "التعامل مع كل نوع", "typesIntro": "التحدي هو ما ستصطدم به غالبًا. والنصيحة هي كيف تُحَب بصدق: يحبك الناس حين يشعرون بالاحترام والأمان، فالمقصود إظهار تقدير حقيقي بشكل يعرفونه، لا التظاهر بأنك شخص آخر.", "ch": "التحدي", "wn": "كيف تكسبه", "types": [["INTJ", "إرادتان قويتان، كل منهما واثق أنه على حق، وكلاهما يميل إلى الصمت.", "احترم كفاءته، وقل الأشياء مباشرة، وأعطوا بعضكم مساحة دون حساب النقاط."], ["INTP", "يظل يحلل ويؤجل القرار، وهذا يزعج رغبتك في الإنجاز.", "ناقش الأفكار معه، وامنحه وقتًا للقرارات، ولا تضغط عليه للالتزام فورًا."], ["ENTJ", "صراع على من يقود، ونقد صريح.", "تعامل بالأدلة وخطة واضحة، واختلف مباشرة، ودعه يقود حيث يكون ذلك منطقيًا."], ["ENTP", "يجادل للمتعة، وقد يبدو لك هجومًا على خطتك.", "شارك في النقاش وأظهر الفضول ولا تأخذه على نفسك. يحبون من يعارض جيدًا."], ["INFJ", "يشعر بانسحابك بعمق وقد يقرأك أكثر مما تريد.", "كن صادقًا في عالمك الداخلي، وأظهر اهتمامًا ثابتًا، ولا تختفِ دون تفسير."], ["INFP", "يتأذى من الصراحة الحادة، تحركه القيم، ويتأخر في قول ما يزعجه.", "لطّف صياغتك، واسأله عما يهمه، واحترم قيمه حتى لو اختلفت."], ["ENFJ", "يريد قربًا وحضورًا عاطفيًا، وقد يبدو لك ضاغطًا.", "أظهر التقدير بطرق صغيرة منتظمة وأخبره بما تشعر به قبل أن يسأل."], ["ENFP", "متحمس ومشتت، ويريد مشاركة عاطفية قد تتعبك.", "استمع لأفكاره وشاركه رؤيتك وامنحه الدفء في لحظات قصيرة صادقة."], ["ISTJ", "يحب الروتين والتقاليد ويقاوم تغييراتك المجردة.", "كن موثوقًا والتزم بوعودك، وأرِه نتائج عملية قبل أن تطلب التغيير."], ["ISFJ", "يحتاج إلى التقدير ويتجنب الصراع ويتأذى بصمت.", "قل شكرًا، وتذكر تفاصيل حياته، واسأله مباشرة إن كان هناك خطب."], ["ESTJ", "يركز على القواعد وصريح وواثق من طريقته.", "التزم بالمواعيد وأرِه النتائج واحترم النظام، وناقش بالحقائق لا بالمشاعر."], ["ESFJ", "الناس والانسجام أولًا، وقد تبدو باردًا له.", "احضر ما يهمه واسأل عن الأشخاص في حياته."], ["ISTP", "متحفظ مثلك، فيبقى القرب سطحيًا زمنًا طويلًا.", "افعلوا الأشياء معًا بدل الكلام، ولا تجبره على الانفتاح."], ["ISFP", "مشاعره خاصة ويتجنب المواجهة ثم ينسحب إذا ضُغط.", "امنحه حرية، وقدّر ذوقه وحرفته، وناقش المشاكل بلطف."], ["ESTP", "سريع ومندفع ويعيش اللحظة، وهذا يصطدم بنظرتك البعيدة.", "كن محددًا ومباشرًا ومستعدًا للفعل، وحافظ على روح المرح."], ["ESFP", "يريد العفوية والاهتمام، وقد تبدو جادًا أكثر من اللازم.", "كن حاضرًا ومرحًا وامدحه بصدق واترك بعض الخطط مرنة."]]}};

  addPort(f) { S.career.portfolio.push({ id: uid(), name: $("#portname").value.trim(), done: {} }); save(); render(); },
  privStart(f) { S.career.priv = { on: true, label: $("#privname").value.trim(), start: today(), best: 0 }; save(); render(); },
  addHabit(f) { const n = $("#hname").value.trim(); if (!n) return; S.habits.push({ id: uid(), name: n, kind: $("#hkind").value }); save(); render(); },
  addRoutine(f) { S.routine.push({ id: uid(), time: $("#rtime").value, label: $("#rlabel").value.trim(), cat: $("#rcat").value }); save(); render(); },
  addReminder(f) { S.reminders.push({ id: uid(), time: $("#mtime").value, text: $("#mtext").value.trim() }); save(); render(); },
  addPerson(f) { const l = $("#plast").value.trim(); S.people.push({ id: uid(), name: $("#pname").value.trim(), rel: $("#prel").value.trim() || "Contact", cadence: Math.max(1, +$("#pcad").value || 30), last: /^\d{4}-\d{2}-\d{2}$/.test(l) ? l : "", notes: "" }); save(); render(); },
  newPerson(f) { const id = uid(); S.people.push({ id, name: $("#nname").value.trim(), rel: "New", cadence: 30, last: today(), notes: $("#nnote").value.trim() }); S.contacts.push({ id: uid(), date: today(), who: id, kind: "meet", fresh: true }); save(); render(); },
  coach(f) { const i = $("#cin"); const v = i.value; i.value = ""; sendCoach(v); }
};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && acts[t.dataset.act]) acts[t.dataset.act](t, e); });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (f && forms[f.dataset.form]) { e.preventDefault(); forms[f.dataset.form](f); } });
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.draft) D[t.dataset.draft] = t.value; });
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.jplan) { const j = S.career.jobs.find(x => x.id === t.dataset.jplan); if (j) { j.plan = t.value; save(); render(); } }
  else if (t.dataset.job) { const j = S.career.jobs.find(x => x.id === t.dataset.job); if (j) { j.stage = t.value; if (t.value !== "saved" && !j.applied) j.applied = today(); save(); render(); } }
  else if (t.dataset.ci) { ci()[t.dataset.ci] = t.value === "" ? "" : clamp(+t.value, 0, 14); save(); render(); }
  else if (t.dataset.set) { const [a, b] = t.dataset.set.split("."); S[a][b] = t.type === "number" ? Math.max(0, +t.value || 0) : t.value; save(); if (a === "social") render(); }
  else if (t.dataset.draft) D[t.dataset.draft] = t.value;
});


document.addEventListener("change", e => {
  const t = e.target; if (!t || t.id !== "impfile" || !t.files || !t.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j || !Array.isArray(j.habits) || !Array.isArray(j.routine) || !j.profile) throw 0;
      if (!confirm("Replace everything in the app with this file?")) return;
      S = j; S.rdone = S.rdone || {}; S.demo = !!S.demo; save(); render(); setStatus("Imported");
    } catch (err) { setStatus("That file is not a Longview export"); }
  };
  rd.readAsText(t.files[0]); t.value = "";
});


/* ---------- install as an app (PWA) ---------- */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => { }));
let installEvt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = $("#installBtn"); if (b && !standalone) b.hidden = false; });
addEventListener("appinstalled", () => { installEvt = null; const b = $("#installBtn"); if (b) b.hidden = true; });
$("#installBtn").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => { }); installEvt = null; $("#installBtn").hidden = true; });
(function () {
  let hid = false; try { hid = localStorage.getItem("longview.ioshint") === "1"; } catch (e) { }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone;
  const h = $("#iosHint"); if (h && ios && !hid) h.hidden = false;
  const x = $("#iosHide"); if (x) x.addEventListener("click", ev => { ev.preventDefault(); h.hidden = true; try { localStorage.setItem("longview.ioshint", "1"); } catch (e) { } });
})();

/* ---------- boot ---------- */
S = lsGet();
if (!S || !S.habits) S = demoState();
S.rdone = S.rdone || {};
GAP = S.lastOpen ? Math.max(0, diffDays(today(), S.lastOpen)) : 0;
if (S.lastOpen !== today()) { S.lastOpen = today(); save(); }
route();
setTimeout(connectStore, 60);
</script>
